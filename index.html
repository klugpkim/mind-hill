<script>
(function(){function show(m){var l=document.getElementById('loading');if(!l||l.dataset.err)return;l.dataset.err=1;l.innerHTML='<div style="text-align:center;line-height:1.6">풍경을 불러오지 못했어요.<br>새로고침 해주세요.<small style="opacity:.6;font-size:11px;word-break:break-all;display:block;margin-top:10px;padding:0 20px">'+String(m).slice(0,160).replace(/</g,'&lt;')+'</small></div>';}
addEventListener('error',function(e){show(e.message||'error');});addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message||e.reason);});
window.__showErr=show;})();
</script>

    <button class="btn glass" id="b3"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5" fill="rgba(255,255,255,.3)" stroke="#fff" stroke-width="0.8" stroke-linejoin="round" stroke-opacity=".95"/><path d="M12 8.8c-2.6 0-4.3.9-4.7 2.9-.2 1.1-.5 1.8-1.4 2.4C4.9 14.8 4.2 15.6 4.2 16.8c0 1.9 2.3 2.7 7.8 2.7s7.8-.8 7.8-2.7c0-1.2-.7-2-2.7-3.1-.9-.6-1.2-1.3-1.4-2.4-.4-2-2.1-2.9-4.7-2.9z" fill="rgba(255,255,255,.3)" stroke="#fff" stroke-width="0.8" stroke-linejoin="round" stroke-opacity=".95"/></svg><span>명상하기</span></button>

  for(const a of [0,.6,-.6,1.2,-1.2,1.8,-1.8]){
    const c=Math.cos(a),sn=Math.sin(a),x=clampTarget(fx+(ux*c-uz*sn)*5.2,fz+(ux*sn+uz*c)*5.2);
    if(!others.some(([ox,oz])=>Number.isFinite(ox)&&Math.hypot(ox-x[0],oz-x[1])<3.2)){spot=x;break;}
  }
  const [x,z]=spot||clampTarget(fx+ux*5.2,fz+uz*5.2);
  me.tx=x;me.tz=z;me.pending=null;me.joined=null;me.join={id:p.id,yaw:Math.atan2(fx-x,fz-z)};me.mode='walk';
  net.send({t:'mv',id:me.id,x:me.x,z:me.z,tx:x,tz:z,r:me.yaw});
  toast('모닥불 옆으로 가서 함께 앉아요.',2200);
}

joinBtn.onclick=()=>{const p=joinTarget,k=joinKind;hideJoin();if(p&&k==='pet'){petAnimal(p);return;}if(p&&!full)(k==='hug'?hugPeer:joinFire)(p);};
let cdUntil=0;

function startAnim(mode,pending){

const bgmA=$('bgmA');
let bgmCtx=null,bgmG=null;const BGM_VOL=.15;
function bgmSetup(){
  if(bgmCtx)return;
  try{
    bgmCtx=new(window.AudioContext||window.webkitAudioContext)();
    const g=bgmCtx.createGain();g.gain.value=0;bgmG=g;
    bgmCtx.createMediaElementSource(bgmA).connect(g).connect(bgmCtx.destination);
    setInterval(()=>{
      const d=bgmA.duration,t=bgmA.currentTime;if(!bgmG||bgmA.paused||!isFinite(d)||d<=0)return;
      const F=1.5;let v=BGM_VOL;if(t<F)v*=Math.max(0,t/F);if(d-t<F)v*=Math.max(0,(d-t)/F);
      bgmG.gain.setTargetAtTime(v,bgmCtx.currentTime,.05);
    },100);
  }catch(e){bgmCtx=null;bgmG=null;bgmA.volume=.2;}
}
let bgmOn=true;try{bgmOn=localStorage.getItem('bgm')!=='off';}catch(e){}
const BGM_ON='<svg viewBox="0 0 24 24"><path d="M4 9.5h3l4.5-3.5v12L7 14.5H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const BGM_OFF='<svg viewBox="0 0 24 24"><path d="M4 9.5h3l4.5-3.5v12L7 14.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function bgmIcon(){$('bgm').innerHTML=bgmOn?BGM_ON:BGM_OFF;}
function bgmPlay(){if(!bgmOn)return;bgmSetup();if(bgmCtx&&bgmCtx.state==='suspended')bgmCtx.resume();bgmA.play().catch(()=>{});}

$('donate-close').onclick=()=>$('donate').classList.remove('on');
$('donate').addEventListener('pointerdown',e=>{if(e.target===$('donate'))$('donate').classList.remove('on');});
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))$('modal').classList.remove('on');});

  }else startAnim('cup',{at:.5,text:r.text,scream:false});

/* ---------- 카메라 / 리사이즈 ---------- */
let camYaw=0,camYawS=0,camYawMoved=false;
function turnView(d){camYaw=clamp(camYaw+d,-.75,.75);camYawMoved=true;}
$('vl').onclick=()=>turnView(-.3);$('vr').onclick=()=>turnView(.3);
addEventListener('keydown',e=>{if($('modal').classList.contains('on')||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowLeft')turnView(-.3);else if(e.key==='ArrowRight')turnView(.3);});
let PORTRAIT=false,CHARBOOST=1,REFD=87;const _cd=new THREE.Vector3(),_cd2=new THREE.Vector3();const camBase=new THREE.Vector3(),camOff=new THREE.Vector3(),tgtTmp=new THREE.Vector3();
function resize(){
  const w=VW(),h=VH(),asp=w/h;PORTRAIT=asp<.9;
  renderer.setSize(w,h,false);
  const shift=PORTRAIT?.12:.3,k=PORTRAIT?1:Math.max(1,1.36/asp);
  camera.fov=PORTRAIT?50:46;
  camBase.copy(CAM_TARGET).add(CAM_BASE.clone().sub(CAM_TARGET).multiplyScalar(k));
  camera.position.copy(camBase);camera.lookAt(CAM_TARGET);REFD=camBase.distanceTo(CAM_TARGET)*.95;
  camera.aspect=w/(h*(1+shift));camera.setViewOffset(w,h*(1+shift),0,0,w,h);camera.updateProjectionMatrix();
  CHARBOOST=PORTRAIT?1+(.9-asp)*.35:(h<520?1.35:1);
  UK=PORTRAIT?1:clamp(w/960,.75,1.4);bubLayer.style.setProperty('--k',UK);namesLayer.style.setProperty('--k',UK);
}
let _rw=0;
const onResize=()=>{if($('modal').classList.contains('on')&&VW()===_rw)return;_rw=VW();resize();};

for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault());
(()=>{const vv=window.visualViewport,m=$('modal');if(!vv)return;const f=()=>{if(m.classList.contains('on')){m.style.top=vv.offsetTop+'px';m.style.height=vv.height+'px';m.style.bottom='auto';}else{m.style.top='';m.style.height='';m.style.bottom='';}};vv.addEventListener('resize',f);vv.addEventListener('scroll',f);new MutationObserver(f).observe(m,{attributes:true,attributeFilter:['class']});})();

/* ---------- 메인 루프 ---------- */
let last=performance.now(),acc=0,T=0;
function frame(now){
  const raw=now-last;const dt=Math.min(.05,raw/1000);last=now;T+=dt;
  if(raw<100&&!document.hidden){perfSum+=raw;if(++perfN>=90){const avg=perfSum/perfN;perfN=0;perfSum=0;
    if(avg>26&&dpr>.8){dpr=Math.max(.8,dpr-.15);perfOK=0;renderer.setPixelRatio(dpr);renderer.setSize(VW(),VH(),false);}
    else if(avg<15&&dpr<MAXDPR){if(++perfOK>=4){perfOK=0;dpr=Math.min(MAXDPR,dpr+.1);renderer.setPixelRatio(dpr);renderer.setSize(VW(),VH(),false);}}
    else perfOK=0;}}
  if(!qp.has('closeup')){const dx=clamp(me.x+6,-60,60),dz=clamp(me.z+8,-60,60),k=Math.min(1,dt*3);camOff.x+=(dx-camOff.x)*k;camOff.z+=(dz-camOff.z)*k;}
  camYawS+=(camYaw-camYawS)*Math.min(1,dt*4);
  if(!qp.has('closeup')){
    camYawMoved=Math.abs(camYaw-camYawS)>.0005;
    const bx=camBase.x-CAM_TARGET.x,bz=camBase.z-CAM_TARGET.z,c=Math.cos(camYawS),sn=Math.sin(camYawS);
    camera.position.set(CAM_TARGET.x+camOff.x+bx*c+bz*sn,camBase.y,CAM_TARGET.z+camOff.z-bx*sn+bz*c);
    tgtTmp.copy(CAM_TARGET).add(camOff);camera.lookAt(tgtTmp);
  }
  camera.getWorldDirection(_cd);
  {const all=[me,...peers.values()];for(const e of all){e.sx=0;e.sz=0;}
   for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
     if(d<SEP_D&&d>1e-3){const k=(SEP_D-d)/2/d;a.sx-=dx*k;a.sz-=dz*k;b.sx+=dx*k;b.sz+=dz*k;}}}
  update(me,dt);for(const p of peers.values())update(p,dt);
  updatePets();
  placeJoin();
  for(const e of [me,...peers.values()]){const [sx,sy]=toScreen(e.x,topY(e.x,e.z),e.z);e.label.style.transform=`translate(${sx}px,${sy+8*UK}px) translate(-50%,0)`;}
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.t+=dt;
    if(b.t>BUBBLE_LIFE){b.el.remove();bubbles.splice(i,1);continue;}
    b.x+=(b.vx+Math.sin(b.t*1.8+b.seed)*14*UK)*dt;b.y+=b.vy*dt;
    const pop=Math.min(1,b.t/.35),fade=b.t<BUBBLE_LIFE*.45?1:Math.max(0,1-(b.t-BUBBLE_LIFE*.45)/(BUBBLE_LIFE*.55));
    const sc=(.6+.4*pop)*(1-.2*b.t/BUBBLE_LIFE);
    b.el.style.opacity=fade*Math.min(1,b.t*5);
    b.el.style.transform=`translate(${b.x}px,${b.y}px) translate(-50%,-100%) scale(${sc})`;
  }
  seaMat.uniforms.uTime.value=T;
  for(const r of rays)r.material.opacity=.07+.03*Math.sin(T*.5+r.userData.ph);
  for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>640)c.position.x=-640;}
  const mp=motes.p.geometry.attributes.position;
  for(let i=0;i<mp.count;i++){let x=mp.getX(i)+motes.vel[i*2]*dt;if(x>28)x=-44;mp.setXYZ(i,x,1.2+Math.sin(T*1.1+motes.vel[i*2+1])*1.1+((i*37)%10)*.18,mp.getZ(i));}
  mp.needsUpdate=true;
  if(rain){const rp=rain.geometry.attributes.position;for(let i=0;i<rp.count;i+=2){let y=rp.getY(i)-30*dt;if(y<-12)y+=52;const x=rp.getX(i);rp.setXYZ(i,x,y,rp.getZ(i));rp.setXYZ(i+1,x+.15,y-1.2,rp.getZ(i+1));}rp.needsUpdate=true;}
  updateCrash(T,dt);
  if(qp.has('closeup')){const gy=topY(me.x,me.z);camera.position.set(me.x+4,gy+3.8,me.z+8.5);camera.lookAt(me.x,gy+2.6,me.z);}
  renderer.render(scene,camera);
  acc+=dt;
  if(acc>.25){acc=0;for(const id of ['b1','b2','b3','b4'])$(id).disabled=full;$('info').textContent=`${THEME_NAMES[theme]} · 접속 ${peers.size+1}/${MAX_ROOM}${roomNo?` · ${roomNo+1}번 방`:''}`;}
  requestAnimationFrame(frame);
}

setTimeout(()=>{$('loading').style.opacity='0';setTimeout(()=>$('loading').remove(),600);},400);
